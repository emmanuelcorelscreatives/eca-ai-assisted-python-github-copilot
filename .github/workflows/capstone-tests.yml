name: Capstone tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  capstone:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/capstone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Run capstone tests
        run: python -m pytest
